<!-- Google tag (gtag.js) event - delayed navigation helper -->
<script>
  // Helper function to delay opening a URL until a gtag event is sent.
  // Call it in response to an action that should navigate to a URL.
  function gtagSendEvent(url) {
    var callback = function () {
      if (typeof url === 'string') {
        window.location = url;
      }
    };
    gtag('event', 'conversion_event_begin_checkout', {
      'event_callback': callback,
      'event_timeout': 2000,
      // <event_parameters>
    });
    return false;
  }
</script>

  <!-- Non-critical CSS: load after load event so LCP is not blocked (keeps them out of critical chain) -->
  <script>
  (function(){
    function loadNonCritical(){
      var l=[
        {h:'../plugins/fontawesome/css/all.css'},
        {h:'../plugins/themify/css/themify-icons.css'},
        {h:'../plugins/flag-icons/css/flag-icons.min.css'},
        {h:'https://fonts.googleapis.com/css?family=Muli:300,400,500,700,900&display=swap'}
      ];
      l.forEach(function(o){
        var link=document.createElement('link');link.rel='stylesheet';link.href=o.h;document.head.appendChild(link);
      });
    }
    if (document.readyState === 'complete') setTimeout(loadNonCritical, 0);
    else window.addEventListener('load', function(){ setTimeout(loadNonCritical, 0); });
  })();
  </script>
