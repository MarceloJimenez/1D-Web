<!-- PRODUCT DETAIL — big screenshot in a monitor bezel + three outputs with captions -->
<section id="work-wrap" class="section section-fill">
  <div class="container">
    <figure class="frame monitor">
      <span class="screw screw-tl" aria-hidden="true"></span>
      <span class="screw screw-tr" aria-hidden="true"></span>
      <div class="well">
        <img src="../images/zused/1dSoftwareTest-800w.webp"
          srcset="../images/zused/1dSoftwareTest-400w.webp 400w, ../images/zused/1dSoftwareTest-800w.webp 800w"
          sizes="(max-width: 960px) 100vw, 860px" width="800" height="562"
          alt="1DNest software main screen" loading="eager" fetchpriority="high">
      </div>
      <figcaption class="figure-meta">
        <span>1DNEST 4.02 · MAIN SCREEN</span>
        <span class="lcd">READY</span>
      </figcaption>
    </figure>

    <div class="section-heading">
      <h2 class="section-title rails-title"><span>${{index.portfolio2.heading}}$</span></h2>
      <p class="section-sub">${{index.portfolio2.subHeading}}$</p>
    </div>
  </div>
</section>

<section id="work" class="section-bottom">
  <div class="container">
    <div class="shot-grid">
      <div class="shot-frame">
        <span class="titlebar">${{index.portfolio2.title1}}$</span>
        <a class="shot-body" href="../images/zused/Graphic Layouts_page-0001.webp">
          <img src="../images/zused/Graphic Layouts_page-0001-400w.webp"
            srcset="../images/zused/Graphic Layouts_page-0001-400w.webp 400w, ../images/zused/Graphic Layouts_page-0001-800w.webp 800w"
            sizes="(max-width: 768px) 100vw, 340px" width="350" height="453"
            alt="1DNest cut list report with graphic layouts" loading="lazy">
        </a>
        <div class="shot-caption"><p>${{index.portfolio2.par1}}$</p></div>
      </div>
      <div class="shot-frame">
        <span class="titlebar">${{index.portfolio2.title2}}$</span>
        <a class="shot-body" href="../images/zused/1dSoftwareTest.webp">
          <img src="../images/zused/1dSoftwareTest-400w.webp"
            srcset="../images/zused/1dSoftwareTest-400w.webp 400w, ../images/zused/1dSoftwareTest-800w.webp 800w"
            sizes="(max-width: 768px) 100vw, 340px" width="350" height="246"
            alt="1DNest software user interface" loading="lazy">
        </a>
        <div class="shot-caption"><p>${{index.portfolio2.par2}}$</p></div>
      </div>
      <div class="shot-frame">
        <span class="titlebar">${{index.portfolio2.title3}}$</span>
        <a class="shot-body" href="../images/zused/Summary Info_page-0001.webp">
          <img src="../images/zused/Summary Info_page-0001-400w.webp"
            srcset="../images/zused/Summary Info_page-0001-400w.webp 400w, ../images/zused/Summary Info_page-0001-800w.webp 800w"
            sizes="(max-width: 768px) 100vw, 340px" width="350" height="453"
            alt="1DNest summary information report" loading="lazy">
        </a>
        <div class="shot-caption"><p>${{index.portfolio2.par3}}$</p></div>
      </div>
    </div>
  </div>
</section>
