<!-- HERO — machined plate with the classic report + steel tubes photo
    ================================================== -->
<section class="hero" id="top">
  <div class="container">
    <p class="hero-kicker">${{index.slider.kicker}}$</p>
    <h1 class="hero-title rails-title"><span class="hero-title-text">${{index.slider.heading}}$</span></h1>

    <div class="plate hero-plate">
      <span class="screw screw-tl" aria-hidden="true"></span>
      <span class="screw screw-tr" aria-hidden="true"></span>
      <span class="screw screw-bl" aria-hidden="true"></span>
      <span class="screw screw-br" aria-hidden="true"></span>

      <figure class="hero-figure frame">
        <div class="well">
          <img fetchpriority="high" loading="eager" src="../images/zused/sobrep3_02.jpg"
            width="325" height="383"
            alt="Printed 1DNest cutting list report with optimized cut layouts, next to the steel tubes it was computed for">
        </div>
        <figcaption class="figure-meta">
          <span>1DNEST · CUTTING PLAN</span>
          <span class="lcd">EFF 98.6%</span>
        </figcaption>
      </figure>

      <div class="hero-copy">
        <p class="hero-lead">${{index.slider.subHeading}}$</p>

        <div class="cta-tray">
          <div class="cta-row">
            <a href="https://1d-solutions.com/_downloads/1DNest_software_version_402.exe" target="_blank"
              rel="noopener noreferrer" class="btn btn-blue btn-slider">${{index.slider.freeTrial}}$</a>
            <span class="cta-note">${{index.slider.noteTrial}}$</span>
          </div>
          <hr class="rail">
          <div class="cta-row">
            <a href="https://store.payproglobal.com/checkout?products[1][id]=96924" target="_blank"
              rel="noopener noreferrer" class="btn btn-metal" onclick="addToCartSingle()">${{index.slider.buyNow}}$</a>
            <span class="cta-note">${{index.slider.noteBuy}}$</span>
          </div>
          <hr class="rail">
          <div class="cta-row">
            <a href="product.html" class="btn btn-metal">${{index.slider.moreInfo}}$</a>
            <span class="cta-note">${{index.slider.noteInfo}}$</span>
          </div>
        </div>

        <p class="led-line"><span class="led" aria-hidden="true"></span> ${{index.slider.afterTrialMessage}}$</p>
      </div>
    </div>
  </div>
</section>

<div class="steel-divider" aria-hidden="true"></div>
