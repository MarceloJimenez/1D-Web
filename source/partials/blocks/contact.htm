<!-- CONTACT FORM — web3forms + hCaptcha preserved -->
<section class="section section-fill" id="contact">
  <div class="container contact-narrow">
    <div class="contact-heading">
      <h5 class="super-heading">${{index.contact.superHeading}}$</h5>
      <h2 class="section-title rails-title"><span>${{index.contact.heading}}$</span></h2>
      <p class="section-sub">${{index.contact.subHeading}}$</p>
    </div>

    <!-- form message -->
    <div class="alert-success contact__msg" style="display: none" role="alert">
      ${{index.contact.success}}$
    </div>
    <!-- end message -->

    <form class="contact_form plate" action="https://api.web3forms.com/submit" method="POST">
      <span class="screw screw-tl" aria-hidden="true"></span>
      <span class="screw screw-tr" aria-hidden="true"></span>
      <span class="screw screw-bl" aria-hidden="true"></span>
      <span class="screw screw-br" aria-hidden="true"></span>

      <!-- Replace with your Access Key -->
      <input type="hidden" name="access_key" value="7d7a0ab3-e4ad-4a00-accf-396355e9c520">

      <div class="form-grid">
        <div class="field">
          <label for="name">${{index.contact.name}}$ <span class="req">*</span></label>
          <input class="form-control" name="name" id="name" required placeholder="${{index.contact.name-ph}}$" type="text">
        </div>
        <div class="field">
          <label for="email">${{index.contact.email}}$ <span class="req">*</span></label>
          <input class="form-control" name="email" id="email" required placeholder="${{index.contact.email-ph}}$" type="email">
        </div>
      </div>

      <div class="field">
        <label for="subject">${{index.contact.subject}}$ <span class="req">*</span></label>
        <input class="form-control" name="subject" id="subject" required placeholder="${{index.contact.subject-ph}}$" type="text">
      </div>

      <div class="field">
        <label for="message">${{index.contact.body}}$ <span class="req">*</span></label>
        <textarea class="form-control" rows="5" name="message" id="message" required placeholder="${{index.contact.body-ph}}$"></textarea>
      </div>

      <!-- hCaptcha Spam Protection -->
      <div class="h-captcha" data-captcha="true"></div>

      <div class="form-actions">
        <button name="submit" type="submit" class="btn btn-blue">${{index.contact.button}}$</button>
        <p class="small">${{index.contact.par}}$</p>
      </div>
    </form>

    <!-- Required for hCaptcha -->
    <script src="https://web3forms.com/client/script.js" async defer></script>
  </div>
</section>
