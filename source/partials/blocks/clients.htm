<!-- CLIENTS — all logos in one sunken tray (carousel removed with jQuery) -->
<section class="section section-fill" id="client-map">
  <div class="container">
    <div class="section-heading">
      <h2 class="section-title rails-title"><span>${{index.clients.heading}}$</span></h2>
      <p class="section-sub">${{index.clients.subHeading}}$</p>
    </div>

    <div class="client-grid">
      <div class="client-card"><img src="../images/clients/Reliance_882_USA.webp" alt="Reliance logo" loading="lazy"></div>
      <div class="client-card"><img src="../images/clients/ryerson_2030.webp" alt="Ryerson logo" loading="lazy"></div>
      <div class="client-card"><img src="../images/clients/Sisttemex_197_MX.webp" alt="Sisttemex logo" loading="lazy"></div>
      <div class="client-card"><img src="../images/clients/Bauer_146_brz.webp" alt="Bauer logo" loading="lazy"></div>
      <div class="client-card"><img src="../images/clients/HMV_14488.webp" alt="HMV logo" loading="lazy"></div>
      <div class="client-card"><img src="../images/clients/Ivanar_AR_153.webp" alt="Ivanar logo" loading="lazy"></div>
      <div class="client-card"><img src="../images/clients/BradNams_AUS_370.webp" alt="Brad Nams logo" loading="lazy"></div>
      <div class="client-card"><img src="../images/clients/Alucraft_Ireland_155.webp" alt="Alucraft logo" loading="lazy"></div>
    </div>
  </div>
</section>
