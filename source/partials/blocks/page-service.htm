<!-- PAGE BANNER (product) — dark steel band with CTAs -->
<section class="page-banner page-service">
  <div class="container">
    <h1>@@title</h1>
    <p class="banner-desc">@@description</p>
    <div class="banner-actions">
      <a href="https://1d-solutions.com/_downloads/1DNest_software_version_402.exe" target="_blank"
        rel="noopener noreferrer" class="btn btn-blue btn-slider">${{index.product.freeTrial}}$</a>
      <a href="https://store.payproglobal.com/checkout?products[1][id]=96924" target="_blank"
        rel="noopener noreferrer" class="btn btn-silver" onclick="addToCartSingle()">${{index.product.buyNow}}$</a>
    </div>
    <p class="led-line"><span class="led" aria-hidden="true"></span> ${{index.product.afterTrialMessage}}$</p>
  </div>
</section>
