<!-- ABOUT — software screenshot in a monitor bezel + four qualities as group-boxes -->
<section id="about" class="section section-alt section-fill">
  <div class="container">
    <div class="section-heading">
      <h2 class="section-title rails-title"><span>${{index.nav.about}}$</span></h2>
    </div>
    <div class="about-layout">
      <figure class="about-figure frame">
        <span class="screw screw-tl" aria-hidden="true"></span>
        <span class="screw screw-tr" aria-hidden="true"></span>
        <div class="well">
          <img src="../images/zused/hero3-700w.webp"
            srcset="../images/zused/hero3-540w.webp 540w, ../images/zused/hero3-700w.webp 700w, ../images/zused/hero3-1080w.webp 1080w"
            sizes="(max-width: 960px) 100vw, 480px" width="651" height="488"
            alt="Computer showing the 1DNest cutting optimization software" loading="lazy">
        </div>
        <figcaption class="figure-meta">
          <span>1DNEST · MAIN WORKSPACE</span>
          <span class="lcd">READY</span>
        </figcaption>
      </figure>

      <div class="about-grid">
        <div class="group-box">
          <span class="legend">${{index.about.title1}}$</span>
          <p>${{index.about.par1}}$</p>
        </div>
        <div class="group-box">
          <span class="legend">${{index.about.title2}}$</span>
          <p>${{index.about.par2}}$</p>
        </div>
        <div class="group-box">
          <span class="legend">${{index.about.title3}}$</span>
          <p>${{index.about.par3}}$</p>
        </div>
        <div class="group-box">
          <span class="legend">${{index.about.title4}}$</span>
          <p>${{index.about.par4}}$</p>
        </div>
      </div>
    </div>
  </div>
</section>
